<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Halı Saha Aidat Paneli</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Oswald:wght@500;600&display=swap">
<style>
/* Layout: sol menü + içerik alanı; dar ekranda menü üste ızgara olarak döner. Tablo yok, satır listeleri var: mobilde yatay kaydırma gerekmez. Renkler çim saha yeşili, uyarılar turuncu. */
:root{
  --bg:#F3F1EA; --surface:#FFFFFF; --ink:#14261C; --muted:#52645A; --line:#DDD9C8;
  --brand:#0F2A1E; --brand-ink:#F1EFE6; --accent:#B8E04A; --accent-ink:#14261C;
  --ok:#2F7A3E; --ok-bg:#E1F1DF; --warn:#A8530F; --warn-bg:#FBE8D3; --late:#A12B2B; --late-bg:#F8DCDC;
  --display:'Oswald','Arial Narrow',Arial,sans-serif; --body:'DM Sans',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C1A13; --surface:#13271C; --ink:#EDF2E9; --muted:#9DB3A4; --line:#25402F;
  --brand:#071109; --brand-ink:#EDF2E9; --accent:#B8E04A; --accent-ink:#14261C;
  --ok:#8FD39A; --ok-bg:#1B3A26; --warn:#F0B27A; --warn-bg:#3F2A14; --late:#F29A9A; --late-bg:#472020; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C1A13; --surface:#13271C; --ink:#EDF2E9; --muted:#9DB3A4; --line:#25402F;
  --brand:#071109; --brand-ink:#EDF2E9; --accent:#B8E04A; --accent-ink:#14261C;
  --ok:#8FD39A; --ok-bg:#1B3A26; --warn:#F0B27A; --warn-bg:#3F2A14; --late:#F29A9A; --late-bg:#472020; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;margin:0;overflow-x:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto}
nav{background:var(--brand);color:var(--brand-ink);border-radius:14px;padding:20px 14px;display:flex;flex-direction:column;gap:6px;align-self:start;position:sticky;top:16px}
.logo{font-family:var(--display);font-size:22px;letter-spacing:.5px;padding:0 10px 14px;line-height:1.15}
.logo small{display:block;font-family:var(--body);font-size:13px;opacity:.7;letter-spacing:0;margin-top:4px}
nav button{all:unset;cursor:pointer;padding:10px 12px;border-radius:8px;font-size:16px;display:flex;justify-content:space-between;gap:8px}
nav button:hover{background:rgba(255,255,255,.08)}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
nav button:focus-visible,.btn:focus-visible,.ib:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
nav .badge{background:var(--late);color:#fff;border-radius:99px;padding:0 8px;font-size:13px;font-weight:700}
.demo{font-size:13px;opacity:.7;padding:14px 10px 0}
main{min-width:0;display:flex;flex-direction:column;gap:20px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.1;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px;min-width:0}
.card .k{color:var(--muted);font-size:14px}
.card .v{font-family:var(--display);font-size:34px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2;overflow-wrap:anywhere}
.card.hl{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.card.hl .k{color:var(--accent-ink);opacity:.8}
.card .v.neg{color:var(--late)}
.card.hl .v.neg{color:var(--late)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.panel h2{font-family:var(--display);font-weight:500;font-size:22px;margin:0 0 12px}
.two{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 12px;min-width:0}
input{flex:1 1 200px}
.btn{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;background:var(--brand);color:var(--brand-ink)}
.btn.alt{background:var(--accent);color:var(--accent-ink)}
[hidden]{display:none!important}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tile{font:inherit;color:var(--ink);cursor:pointer;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:2px;text-align:left;min-width:0}
.tile:hover{border-color:var(--ok)}
.tile:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tile:disabled{opacity:.5;cursor:default}
.tile span{font-family:var(--display);font-size:22px;font-variant-numeric:tabular-nums}
.tile small{color:var(--muted)}
.btn.sm{padding:6px 12px;font-size:14px;font-weight:500}
.panel p{margin:6px 0}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
/* Satır listeleri: tablo yerine, dar ekranda da sığar */
.list{display:flex;flex-direction:column}
.lrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.lrow:last-child{border-bottom:0}
.lrow .l{min-width:0}
.lrow .l b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow small,.krow small{display:block;color:var(--muted);font-size:13px}
.lrow .rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;font-variant-numeric:tabular-nums}
.lrow .amt{font-weight:700}
.lrow .amt.neg{color:var(--late)}
.krow{padding:10px 0;border-bottom:1px solid var(--line)}
.krow:last-child{border-bottom:0}
.krow b{display:block}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:14px;font-weight:700;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.wait{background:var(--warn-bg);color:var(--warn)}
.pill.late{background:var(--late-bg);color:var(--late)}
/* Üyeler: bir satır = ad, aidat, vade, durum, tek tuş işlem; ayrıntı satıra dokununca açılır */
.mhead,.mrow{display:grid;grid-template-columns:minmax(0,1.6fr) 90px 100px 150px auto;grid-template-areas:"n a v s b";gap:10px;align-items:center}
.mhead{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 0;border-bottom:2px solid var(--line)}
.mhead span:nth-child(2){text-align:right}
.mitem{border-bottom:1px solid var(--line);padding:8px 0}
.mitem:last-child{border-bottom:0}
.mrow .n{grid-area:n;min-width:0}
.mrow .n b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .n small{color:var(--muted);font-size:13px}
.mrow .a{grid-area:a;text-align:right;font-variant-numeric:tabular-nums}
.mrow .v{grid-area:v}
.mrow .s{grid-area:s}
.mrow .i{grid-area:i;display:none;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
.mrow .b{grid-area:b;display:flex;gap:6px;justify-content:flex-end}
.ib{font:inherit;cursor:pointer;width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);font-size:18px;display:grid;place-items:center;padding:0}
.ib.ok{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.mdet{background:var(--bg);border-radius:10px;padding:12px;margin-top:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.mdet p{margin:0;flex:1 1 100%;font-size:14px;color:var(--muted)}
.mrow .n{display:flex;align-items:center;gap:4px}
.nm{min-width:0}
.chk{display:grid;place-items:center;width:36px;height:44px;flex:none;cursor:pointer}
.chk input{flex:none;width:20px;height:20px;padding:0;margin:0;accent-color:var(--ok);cursor:pointer}
.dbt{color:var(--late);font-weight:700;white-space:nowrap}
.dbox{display:flex;align-items:baseline;gap:10px;flex:1 1 100%}
.dbox span{color:var(--muted);font-size:14px}
.dbox b{font-family:var(--display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.dbox b.neg{color:var(--late)}
.mdet .hist{flex:1 1 100%;background:var(--surface);border-radius:8px;padding:2px 12px}
.mdet .hist .lrow{padding:7px 0}
.selbar{position:sticky;bottom:12px;margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--brand);color:var(--brand-ink);border-radius:12px;padding:10px 14px;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.selbar .acts{display:flex;gap:8px}
.selbar .btn.ghost{color:var(--brand-ink);border-color:rgba(255,255,255,.35)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;color:var(--muted);font-size:14px;flex-wrap:wrap}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:110px minmax(0,1fr) 90px;gap:10px;align-items:center;font-size:14px}
.bar i{display:block;height:12px;border-radius:6px;background:var(--brand)}
.track{background:var(--bg);border-radius:6px;height:12px}
.wa{background:#DCF8C6;color:#14261C;border-radius:14px;padding:14px;font-size:15px;line-height:1.5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .wa{background:#1F4A33;color:#EDF2E9}}
:root[data-theme="dark"] .wa{background:#1F4A33;color:#EDF2E9}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.brand{max-width:1280px;margin:24px auto 0;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:14px;text-align:center;overflow-wrap:anywhere}
.brand b{color:var(--ink)}
.brand a{color:var(--ink);text-decoration:underline;-webkit-user-select:text;user-select:text}
body{-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--brand);color:var(--brand-ink);padding:10px 18px;border-radius:10px;font-weight:700;box-shadow:0 6px 24px rgba(0,0,0,.25);max-width:calc(100vw - 32px);text-align:center;z-index:50}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr);gap:16px}
  nav{position:static;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:10px;gap:4px}
  nav button{justify-content:center;align-items:center;text-align:center;flex-wrap:wrap;font-size:13px;padding:10px 2px;min-height:44px}
  .logo,.demo{display:none}
  .two{grid-template-columns:minmax(0,1fr)}
  h1{font-size:28px}
}
@media (max-width:620px){
  .cards{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .cards>:last-child:nth-child(odd){grid-column:1/-1}
  .card{padding:12px 14px}
  .card .k{font-size:13px}
  .card .v{font-size:24px}
  .panel{padding:14px}
  .mhead{display:none}
  .mrow{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n s" "i b";row-gap:6px}
  .mrow .a,.mrow .v{display:none}
  .mrow .i{display:block}
  .bar{grid-template-columns:78px minmax(0,1fr) 82px;gap:8px}
  .form{grid-template-columns:minmax(0,1fr)}
  .tools select,.tools .btn{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <nav aria-label="Ana menü">
    <div class="logo">HALI SAHA<br>AİDAT PANELİ<small>Örnek işletme · Kasım 2026</small></div>
    <button data-tab="ozet" aria-current="page">Özet</button>
    <button data-tab="uyeler">Üyeler</button>
    <button data-tab="finans">Gelir-Gider</button>
    <button data-tab="satis">Satış</button>
    <button data-tab="stok">Stok <span class="badge" id="stokBadge">0</span></button>
    <button data-tab="hatirlatma">Hatırlatma <span class="badge" id="navBadge">0</span></button>
    <button data-tab="kvkk">KVKK</button>
    <div class="demo">Demo: veriler örnektir, sayfa yenilenince sıfırlanır.</div>
  </nav>
  <main id="view"></main>
</div>
<footer class="brand">
  <b>BY SİRİUS</b> · <a href="https://bysirius.com">bysirius.com</a> · <a href="mailto:info@bysirius.com">info@bysirius.com</a> · <a href="https://wa.me/905355032634">WhatsApp +90 535 503 26 34</a><br>
  © 2026 BY SİRİUS. Bu demo ve tasarımı izinsiz kopyalanamaz, çoğaltılamaz veya yeniden kullanılamaz.
</footer>
<div class="toast" id="toast" hidden role="status"></div>

<script>
// Demo tarihi sabit: 8 Kasım 2026. Aidat vadesi her üyenin ayın kaçıncı günü olduğuna bağlı.
var TODAY = 8, MONTH = 'Kasım 2026';
var first = ['Ahmet','Mehmet','Can','Emre','Burak','Okan','Serkan','Kaan','Mert','Onur','Tolga','Barış','Cem','Deniz','Eren','Furkan','Gökhan','Hakan','İlker','Kerem','Murat','Necati','Oğuz','Polat','Rıza','Selim','Taner','Uğur','Volkan','Yasin'];
var last = ['Yılmaz','Kaya','Demir','Şahin','Çelik','Aydın','Öztürk','Arslan','Doğan','Kılıç','Aslan','Çetin','Koç','Kurt','Özdemir','Polat','Erdoğan','Güneş','Aksoy','Bulut'];
var seed = 7; function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
var members = [];
for (var i = 0; i < 280; i++) {
  var fee = rnd() < 0.7 ? 1500 : 1200;
  var due = 1 + Math.floor(rnd() * 15);
  var paid = due > TODAY ? rnd() < 0.35 : rnd() < 0.82;
  var ay = rnd() < 0.93;
  members.push({id:i+1, name:first[i%30]+' '+last[Math.floor(i/30)%20], phone:'05'+(30+Math.floor(rnd()*20))+' *** ** '+String(10+Math.floor(rnd()*89)), fee:fee, due:due, paid:paid, reminded:false, aydin:ay, wa:ay && rnd() < 0.9});
}
var expenses = [
  {d:'03 Kas', cat:'Elektrik', note:'Aydınlatma faturası', amt:38500},
  {d:'04 Kas', cat:'Su', note:'Saha sulama', amt:9200},
  {d:'01 Kas', cat:'Kira', note:'Zemin kirası', amt:90000},
  {d:'05 Kas', cat:'Personel', note:'Saha görevlileri', amt:62000},
  {d:'06 Kas', cat:'Saha bakımı', note:'Çim ve file bakımı', amt:15100}
];
// Kafeterya ve ekipman ürünleri. stock = şu anki stok, min = kritik seviye, sold = bu ay satılan adet.
var products = [
  {id:1, name:'Su 0,5 L', cat:'Kafeterya', price:15, cost:8, stock:240, min:100, sold:142},
  {id:2, name:'Gazlı içecek', cat:'Kafeterya', price:40, cost:24, stock:96, min:48, sold:38},
  {id:3, name:'Çay', cat:'Kafeterya', price:20, cost:5, stock:300, min:100, sold:120},
  {id:4, name:'Enerji içeceği', cat:'Kafeterya', price:70, cost:45, stock:30, min:36, sold:12},
  {id:5, name:'Atıştırmalık', cat:'Kafeterya', price:35, cost:20, stock:60, min:30, sold:41},
  {id:6, name:'Top', cat:'Ekipman', price:900, cost:600, stock:6, min:4, sold:2},
  {id:7, name:'Forma', cat:'Ekipman', price:450, cost:260, stock:18, min:10, sold:6},
  {id:8, name:'Kaleci eldiveni', cat:'Ekipman', price:600, cost:380, stock:3, min:4, sold:1}
];
var salesLog = [{t:'19:05',name:'Su 0,5 L',amt:15},{t:'19:02',name:'Çay',amt:20},{t:'18:47',name:'Forma',amt:450},{t:'18:31',name:'Gazlı içecek',amt:40}];
// Ocak-Ekim kapanmış aylar (örnek veri): aidat, satış ve gider. Kasım canlı hesaplanır, yıllık toplam ikisini birleştirir.
// Üye geçmişi: pm = o ay ödedi mi (sabit kayıt), h = şu anki durum (borç tahsil edilince true olur), pd = ödeme günü, coll = bu ay tahsil edilen eski borç.
var MN = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim'];
var PP = [0.985,0.985,0.985,0.985,0.985,0.985,0.985,0.96,0.93,0.88];
members.forEach(function(m){
  m.pm = []; m.pd = [];
  for (var k = 0; k < 10; k++) { m.pm.push(rnd() < PP[k]); m.pd.push(Math.min(28, Math.max(1, m.due + Math.floor(rnd()*5) - 1))); }
  m.h = m.pm.slice(); m.coll = 0;
});
// Geçmiş aylar aidat geliri üye kayıtlarından toplanır; böylece üye geçmişi ile gelir-gider her zaman tutar.
var hist = MN.map(function(n, k){
  return {n:n, aidat:members.reduce(function(a,m){ return a + (m.pm[k] ? m.fee : 0); }, 0), sat:Math.round((11000+rnd()*5000)/100)*100, gider:Math.round((196000+rnd()*24000)/100)*100};
});
var tab = 'ozet', q = '', filt = 'hepsi', page = 0, PER = 12, per = 'ay', openId = 0, sel = {};
function arrears(m){ var n = 0; m.h.forEach(function(ok){ if (!ok) n++; }); return n * m.fee; }
function debt(m){ return arrears(m) + (status(m)==='late' ? m.fee : 0); }
function collect(m){ var a = arrears(m); m.h = m.h.map(function(){ return true; }); m.coll += a; if (!m.paid) { m.paid = true; m.reminded = false; a += m.fee; } return a; }
var tl = function(n){ return n.toLocaleString('tr-TR') + ' ₺'; };
function status(m){ if (m.paid) return 'ok'; var late = TODAY - m.due; return late >= 2 ? 'late' : 'wait'; }
function label(m){ var s = status(m); return s==='ok' ? 'Ödendi' : s==='late' ? (TODAY-m.due)+' gün gecikti' : (m.due>TODAY ? 'Bekliyor' : 'Vade günü'); }
function stats(){
  var exp = 0, cur = 0, coll = 0, arr = 0, late = 0, lateAmt = 0, paidN = 0;
  members.forEach(function(m){ exp += m.fee; coll += m.coll; arr += arrears(m); if (m.paid) { cur += m.fee; paidN++; } else if (status(m)==='late') { late++; lateAmt += m.fee; } });
  var got = cur + coll;
  var spend = expenses.reduce(function(a,e){ return a + e.amt; }, 0);
  var sat = 0, satCost = 0;
  products.forEach(function(p){ sat += p.sold * p.price; satCost += p.sold * p.cost; });
  var income = got + sat;
  return {exp:exp, cur:cur, coll:coll, arr:arr, got:got, out:exp-cur, late:late, lateAmt:lateAmt, paidN:paidN, spend:spend, sat:sat, satProfit:sat-satCost, income:income, net:income-spend};
}
// Yıl başından bugüne: kapanmış aylar + canlı Kasım. Aylık net ile aynı kaynaktan hesaplanır.
function ytd(){
  var s = stats(), a = s.got, t = s.sat, g = s.spend;
  hist.forEach(function(h){ a += h.aidat; t += h.sat; g += h.gider; });
  return {aidat:a, sat:t, income:a+t, spend:g, net:a+t-g, months:hist.length+1};
}
function toast(t){ var el = document.getElementById('toast'); el.textContent = t; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(function(){ el.hidden = true; }, 2200); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function card(k, v, cls, neg){ return '<div class="card'+(cls?' '+cls:'')+'"><div class="k">'+k+'</div><div class="v'+(neg&&v<0?' neg':'')+'">'+tl(v)+'</div></div>'; }

function viewOzet(){
  var s = stats(), y = ytd(), pct = Math.round(s.cur / s.exp * 100);
  var cats = {}; expenses.forEach(function(e){ cats[e.cat] = (cats[e.cat]||0) + e.amt; });
  var max = Math.max.apply(null, Object.keys(cats).map(function(k){ return cats[k]; }));
  var bars = Object.keys(cats).sort(function(a,b){ return cats[b]-cats[a]; }).map(function(k){

  else if (t.dataset.restock) {
    var r = products[+t.dataset.restock - 1], qn = r.cat==='Kafeterya' ? 24 : 6;
    r.stock += qn; expenses.unshift({d:('0'+TODAY).slice(-2)+' Kas', cat:'Stok alımı', note:r.name+' x'+qn, amt:qn*r.cost});
    render(); toast(r.name+': +'+qn+' stok girildi, gider yazıldı');
  }
  else if (t.dataset.page) { page += +t.dataset.page; render(); }
  else if (t.dataset.send) { var n = queue().length; queue().forEach(function(m){ m.reminded = true; }); render(); toast(n+' üyeye hatırlatma gönderildi (demo)'); }
});
document.addEventListener('input', function(e){ if (e.target.id==='q') { q = e.target.value; page = 0; var pos = e.target.selectionStart; render(); var el = document.getElementById('q'); el.focus(); el.setSelectionRange(pos,pos); } });
document.addEventListener('change', function(e){
  if (e.target.dataset.sel) { var id = e.target.dataset.sel; if (e.target.checked) sel[id] = true; else delete sel[id]; render(); return; }
  if (e.target.id==='f') { filt = e.target.value; page = 0; render(); } });
document.addEventListener('submit', function(e){
  e.preventDefault();
  if (e.target.id==='expForm') {
    var amt = +document.getElementById('eAmt').value;
    if (!amt) return;
    expenses.unshift({d:('0'+TODAY).slice(-2)+' Kas', cat:document.getElementById('eCat').value, note:document.getElementById('eNote').value, amt:amt});
    render(); toast('Gider kaydedildi');
  }
});
document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
render();
</script>

</body>
</html>
