label{font-size:12px;font-weight:800;color:var(--mut);display:block;margin:8px 0 3px}

.cal{overflow:auto;border:1px solid var(--line);border-radius:12px}

.cell{height:30px;min-width:38px;border-radius:7px;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800}

.card{transition:transform .25s,box-shadow .25s}

function nights(a,b){return Math.round((new Date(b+'T12:00')-new Date(a+'T12:00'))/864e5)}
function hotelState(rid,d){ // d iso
  for(const r of RES){if(r.room!==rid||r.status==='cancelled'||r.hours)continue;if(r.start<=d&&d<r.end)return r.status==='pending'?'wait':'busy'}
  return 'free';
}
function careState(rid,date,h){
  for(const r of RES){if(r.room!==rid||r.status==='cancelled'||!r.hours||r.start!==date)continue;if(r.hours.includes(h))return r.status==='pending'?'wait':'busy'}
  return 'free';
}

    <p style="font-size:13px;color:var(--mut)">Önce giriş gününe, sonra çıkış gününe tıklayın (aynı oda).</p>`;
  }else{
    cal=`<div class="row" style="margin-bottom:8px"><label style="margin:0">Gün:</label><select style="width:auto" onchange="draft.date=this.value;draft.hours=[];draft.room=null;render()">${days.slice(0,7).map(d=>`<option value="${iso(d)}" ${iso(d)===draft.date?'selected':''}>${d.toLocaleDateString('tr-TR',{weekday:'long',day:'numeric',month:'long'})}</option>`).join('')}</select></div>
    <div class="cal"><table><tr><th></th>${HOURS.map(h=>`<th>${h}:00</th>`).join('')}</tr>
    ${rms.map(r=>`<tr><td class="rn">${r.name}<br><small style="color:var(--mut)">${TL(r.price)}/saat</small></td>${HOURS.map(h=>{const st=careState(r.id,draft.date,h),sel=draft.room===r.id&&draft.hours.includes(h);
      return `<td><div class="cell ${sel?'c-sel':'c-'+st}" ${st==='free'?`onclick="pickHour('${r.id}',${h})"`:''}>${sel?'✓':st==='free'?'':st==='busy'?'Dolu':'Bek.'}</div></td>`}).join('')}</tr>`).join('')}</table></div>`;
  }
  const r=draft.room&&room(draft.room);let total=0,desc='';
  if(r&&draft.type==='hotel'&&draft.start){const n=Math.max(1,nights(draft.start,draft.end||draft.start)+(draft.end?0:1));total=n*r.price;desc=`${r.name} • ${fmtD(draft.start)}${draft.end?' → '+fmtD(iso(addD(new Date(draft.end+'T12:00'),1))):''} • ${n} gece`}
  if(r&&draft.type==='care'&&draft.hours.length){total=draft.hours.length*r.price;desc=`${r.name} • ${fmtD(draft.date)} • ${draft.hours.length} saat`}
  return `<div class="card"><h2>Rezervasyon Talebi Oluştur</h2>
   <div class="row" style="margin-bottom:12px">
    <button class="btn ${draft.type==='hotel'?'':'ghost'}" onclick="draft.type='hotel';draft.room=null;draft.start=draft.end=null;render()">🏨 Otel Odası (gün bazlı)</button>
    <button class="btn ${draft.type==='care'?'':'ghost'}" onclick="draft.type='care';draft.room=null;draft.hours=[];render()">🎾 Oyun / Bakım Odası (saat bazlı)</button>
    <div style="margin-left:auto;min-width:200px"><label style="margin:0">Köpeğim</label><select onchange="draft.dog=this.value">${me.dogs.map(d=>`<option ${d.name===draft.dog?'selected':''}>${d.name}</option>`).join('')}</select></div></div>
   <div class="legend"><span><i style="background:#dcfce7"></i>Boş</span><span><i style="background:#fde68a"></i>Onay bekliyor</span><span><i style="background:#fecaca"></i>Dolu</span><span><i style="background:var(--pri)"></i>Seçiminiz</span></div><div style="margin-top:10px">${cal}</div></div>
   <div class="card" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:space-between"><div><b>${desc||'Henüz seçim yapılmadı'}</b><div style="color:var(--mut);font-size:13px">${total?'Toplam: <b style="color:var(--ink);font-size:18px">'+TL(total)+'</b> — kapora (%30): '+TL(total*.3):'Takvimden boş bir hücre seçin.'}</div></div>
   <button class="btn acc" ${total?'':'disabled style="opacity:.5"'} onclick="submitRes(${total})">Talep Gönder & Öde →</button></div>`;
}
function pickDay(rid,s){
  if(draft.room!==rid||!draft.start||draft.end){draft.room=rid;draft.start=s;draft.end=null;render();return}
  if(s<draft.start){draft.start=s;render();return}
  for(let d=draft.start;d<=s;d=iso(addD(new Date(d+'T12:00'),1))){if(hotelState(rid,d)!=='free'){toast('⚠ Aralıkta dolu gün var');return}}
  draft.end=s;render();
}
function pickHour(rid,h){
  if(draft.room!==rid){draft.room=rid;draft.hours=[]}
  draft.hours=draft.hours.includes(h)?draft.hours.filter(x=>x!==h):[...draft.hours,h].sort((a,b)=>a-b);
  if(!draft.hours.length)draft.room=null;render();
}
function submitRes(total){
  const rid=draft.room,isH=draft.type==='hotel',snap={...draft,hours:[...draft.hours]};
  pay(total,'Rezervasyon: '+$('.card b').textContent,paid=>{
    const r={id:nextId++,cust:ME,dog:snap.dog,room:rid,start:isH?snap.start:snap.date,end:isH?(iso(addD(new Date((snap.end||snap.start)+'T12:00'),1))):snap.date,status:'pending',total,paid};
    if(!isH)r.hours=snap.hours;RES.push(r);draft={type:snap.type,room:null,start:null,end:null,date:snap.date,hours:[],dog:snap.dog};
    sub.cust='mine';render();showTpl('odeme',r.id);toast('✅ Talebiniz alındı. İşletme onayı sonrası onay mesajı gelecek.');
  },true);
}
function custMine(){
  const mine=RES.filter(r=>r.cust===ME).sort((a,b)=>b.id-a.id);
  return `<div class="card"><h2>Rezervasyonlarım</h2><table><tr><th>No</th><th>Köpek</th><th>Oda</th><th>Tarih</th><th>Tutar</th><th>Durum</th><th></th></tr>
  ${mine.map(r=>`<tr><td>#${r.id}</td><td>${r.dog}</td><td>${room(r.room).name}</td><td>${r.hours?fmtD(r.start)+' '+r.hours[0]+':00–'+(r.hours.slice(-1)[0]+1)+':00':fmtD(r.start)+' → '+fmtD(r.end)}</td><td>${TL(r.total)}<br><small>Ödenen ${TL(r.paid)}</small></td><td>${stPill(r.status)}</td>
  <td>${r.status!=='cancelled'?`<button class="btn sm bad" onclick="cancelRes(${r.id})">İptal</button>`:''}</td></tr>`).join('')||'<tr><td colspan=7>Kayıt yok</td></tr>'}</table></div>
  <div class="card"><h3>📩 Size otomatik gönderilen mesajlar</h3><div class="row">${mine[0]?['onay','hatirla','iptal','odeme'].map(k=>`<button class="btn ghost sm" onclick="showTpl('${k}',${mine[0].id})">${tpl(k,mine[0]).t}</button>`).join(''):''}</div></div>`;
}
function cancelRes(id){const r=RES.find(x=>x.id===id);r.status='cancelled';render();showTpl('iptal',id)}
function custDogs(){
  return custOf(ME).dogs.map(d=>dogCard(d,true)).join('')+`<button class="btn ghost" onclick="toast('Demo: Yeni köpek ekleme formu burada açılır')">+ Yeni köpek ekle</button>`;

function dogCard(d,edit){
  return `<div class="card dogcard"><div class="av">${DOGSVG(d.color)}</div><div style="flex:1"><h3>${d.name} <span class="tag">${d.breed}</span></h3>

/* ================= İŞLETME PANELİ ================= */

}
function bizOzet(){
  const act=RES.filter(r=>r.status!=='cancelled'),pend=RES.filter(r=>r.status==='pending').length;
  const tHot=ROOMS.filter(r=>r.type==='hotel'),occ=tHot.filter(r=>hotelState(r.id,iso(today))!=='free').length;
  const mx=Math.max(...FIN.gelir);
  return `<div class="grid g4" style="margin-bottom:16px"><div class="kpi k1"><small>Bu ay gelir</small><b>172.000 ₺</b><small>▲ %9 geçen aya göre</small></div><div class="kpi k2"><small>Bugünkü doluluk</small><b>${occ}/${tHot.length} oda</b><small>${Math.round(occ/tHot.length*100)}%</small></div><div class="kpi k3"><small>Onay bekleyen</small><b>${pend}</b><small>talep</small></div><div class="kpi k4"><small>Toplam müşteri</small><b>${CUST.length+127}</b><small>kayıtlı köpek: ${CUST.reduce((a,c)=>a+c.dogs.length,0)+141}</small></div></div>
  <div class="grid g2"><div class="card"><h3>Gelir / Gider (bin ₺)</h3><div class="bars">${FIN.months.map((m,i)=>`<div><div class="b1" style="height:${FIN.gelir[i]/mx*130}px" title="Gelir"></div><div class="b2" style="height:${FIN.gider[i]/mx*130}px" title="Gider"></div><small>${m}</small></div>`).join('')}</div><div class="legend"><span><i style="background:var(--pri2)"></i>Gelir</span><span><i style="background:var(--acc2)"></i>Gider</span></div></div>
  <div class="card"><h3>Onay bekleyen talepler</h3>${RES.filter(r=>r.status==='pending').map(r=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:8px 0"><div><b>${r.dog}</b> • ${room(r.room).name}<br><small>${custOf(r.cust).name} • ${r.hours?fmtD(r.start)+' '+r.hours[0]+':00':fmtD(r.start)+'→'+fmtD(r.end)}</small></div><div><button class="btn sm" onclick="approve(${r.id})">Onayla</button> <button class="btn sm bad" onclick="cancelRes(${r.id})">Reddet</button></div></div>`).join('')||'<p>Bekleyen talep yok 🎉</p>'}</div></div>
  <div class="card"><h3>Bugün gelen / giden</h3><table><tr><th>Köpek</th><th>Oda</th><th>İşlem</th></tr>${act.filter(r=>!r.hours&&(r.start===iso(today)||r.end===iso(today))).map(r=>`<tr><td>${r.dog}</td><td>${room(r.room).name}</td><td>${r.start===iso(today)?'<span class="pill p-info">Giriş</span>':'<span class="pill p-wait">Çıkış</span>'}</td></tr>`).join('')}</table></div>`;
}
function approve(id){const r=RES.find(x=>x.id===id);r.status='confirmed';render();showTpl('onay',id);toast('✅ Onaylandı — müşteriye otomatik mesaj gitti')}

  ${[...RES].sort((a,b)=>b.id-a.id).map(r=>`<tr><td>#${r.id}</td><td>${custOf(r.cust).name}</td><td>${r.dog}</td><td>${room(r.room).name}</td><td>${r.hours?fmtD(r.start)+' '+r.hours[0]+':00–'+(r.hours.slice(-1)[0]+1)+':00':fmtD(r.start)+'→'+fmtD(r.end)}</td><td>${TL(r.total)} / ${TL(r.paid)}</td><td>${stPill(r.status)}</td>
  <td style="white-space:nowrap">${r.status==='pending'?`<button class="btn sm" onclick="approve(${r.id})">Onayla</button> `:''}${r.status!=='cancelled'?`<button class="btn sm ghost" onclick="showTpl('hatirla',${r.id})">Hatırlat</button> <button class="btn sm bad" onclick="cancelRes(${r.id})">İptal</button>`:''}</td></tr>`).join('')}</table></div></div>`;
}
function bizDoluluk(){
  const days=[...Array(14)].map((_,i)=>addD(today,i)),h=ROOMS.filter(r=>r.type==='hotel');
  return `<div class="card"><h2>Oda Doluluk Takvimi (14 gün)</h2><div class="cal"><table><tr><th></th>${days.map(d=>`<th>${d.getDate()}<br>${d.toLocaleDateString('tr-TR',{weekday:'short'})}</th>`).join('')}</tr>
  ${h.map(r=>`<tr><td class="rn">${r.name}</td>${days.map(d=>{const st=hotelState(r.id,iso(d));return `<td><div class="cell c-${st}" style="cursor:default">${st==='free'?'':st==='busy'?'●':'?'}</div></td>`}).join('')}</tr>`).join('')}
  <tr><td class="rn">Doluluk %</td>${days.map(d=>{const n=h.filter(r=>hotelState(r.id,iso(d))!=='free').length;return `<td><b style="font-size:12px">${Math.round(n/h.length*100)}</b></td>`}).join('')}</tr></table></div>
  <div class="legend" style="margin-top:10px"><span><i style="background:#dcfce7"></i>Boş</span><span><i style="background:#fde68a"></i>Onay bekliyor</span><span><i style="background:#fecaca"></i>Dolu</span></div></div>`;
}
function bizMusteri(){
  return `<div class="card"><h2>Müşteri Kartları & Tarihçe</h2><div class="row" style="margin-bottom:8px"><input placeholder="Müşteri, köpek veya ırk ara…" style="max-width:340px" oninput="filterCust(this.value)"></div></div><div id="clist">${custList('')}</div>`;
}
function custList(q){
  q=q.toLowerCase();
  return CUST.filter(c=>!q||(c.name+c.dogs.map(d=>d.name+d.breed).join()).toLowerCase().includes(q)).map(c=>`<div class="card"><div class="row" style="justify-content:space-between"><div><h3 style="margin:0">${c.name}</h3><small style="color:var(--mut)">📞 ${c.phone} • ✉ ${c.email}</small></div><div><button class="btn sm ghost" onclick="toast('Demo: WhatsApp mesajı açılır')">💬 Yaz</button> <button class="btn sm ghost" onclick="showTpl('kampanya',${(RES.find(r=>r.cust===c.id)||RES[0]).id})">🎁 Kampanya gönder</button></div></div>
   ${c.dogs.map(d=>dogCard(d,false)).join('')}<h3 style="font-size:14px">Geçmiş hizmetler</h3><table>${c.hist.map(h=>`<tr><td>${h[0]}</td><td>${h[1]}</td><td>${h[2]}</td></tr>`).join('')}</table></div>`).join('')||'<div class="card">Sonuç yok</div>';
}
function filterCust(v){$('#clist').innerHTML=custList(v)}
function bizFinans(){
  const g=FIN.gelir[5]*1000,gi=FIN.gider[5]*1000;
  return `<div class="grid g3" style="margin-bottom:16px"><div class="kpi k1"><small>Gelir (Ekim)</small><b>${TL(g)}</b></div><div class="kpi k2"><small>Gider (Ekim)</small><b>${TL(gi)}</b></div><div class="kpi k3"><small>Net kâr</small><b>${TL(g-gi)}</b></div></div>
  <div class="grid g2"><div class="card"><h3>Gelir dağılımı</h3>${[['Pansiyon / otel',48],['Eğitim',24],['Oyun alanı & bakım',14],['Mağaza satışı',14]].map(x=>`<div style="margin:8px 0"><div class="row" style="justify-content:space-between"><span>${x[0]}</span><b>%${x[1]}</b></div><div class="occ"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div>
  <div class="card"><h3>Giderler</h3><table>${GIDER.map(x=>`<tr><td>${x[0]}</td><td style="text-align:right">${x[1]}</td></tr>`).join('')}</table><button class="btn sm ghost" style="margin-top:8px" onclick="toast('Demo: Gider ekleme formu')">+ Gider ekle</button></div></div>
  <div class="card"><h3>Son ödemeler (PayTR / iyzico)</h3><table><tr><th>Tarih</th><th>Açıklama</th><th>Kanal</th><th>Tutar</th></tr>${RES.slice(-5).map(r=>`<tr><td>${fmtD(r.start)}</td><td>#${r.id} ${r.dog} – ${room(r.room).name}</td><td>${r.id%2?'PayTR':'iyzico'}</td><td>${TL(r.paid)}</td></tr>`).join('')}</table></div>`;
}
function bizMagaza(){
  return `<div class="card"><h2>Mağaza Ürünleri & Stok</h2><table><tr><th>Ürün</th><th>Fiyat</th><th>Stok</th><th>Bu ay satış</th></tr>${PRODUCTS.map((p,i)=>{const st=[14,60,9,35,4,22,40,7][i];return `<tr><td>${p.e} ${p.n}</td><td>${TL(p.p)}</td><td>${st<10?`<span class="pill p-bad">${st} (kritik)</span>`:st}</td><td>${[12,48,6,22,2,15,31,3][i]}</td></tr>`}).join('')}</table>
  <button class="btn sm ghost" style="margin-top:10px" onclick="toast('Demo: Ürün ekleme / kargo takibi')">+ Ürün ekle</button></div>`;
}
function bizMesaj(){
  const sample=RES[0].id;
  return `<div class="card"><h2>Otomatik Mesajlar & E-posta</h2><p style="color:var(--mut);margin-top:0">Aşağıdaki mesajlar olay gerçekleştiğinde WhatsApp, SMS ve e-posta ile müşteriye kendiliğinden gider.</p>
  <table><tr><th>Tetikleyici</th><th>Kanal</th><th>Durum</th><th></th></tr>
  ${[['Talep alındığında / ödeme','odeme'],['Rezervasyon onaylandığında','onay'],['Girişten 24 saat önce','hatirla'],['İptal edildiğinde','iptal'],['Kampanya / satış maili (toplu)','kampanya']].map(x=>`<tr><td>${x[0]}</td><td>${tpl(x[1],RES[0]).ch}</td><td><span class="pill p-ok">Aktif</span></td><td><button class="btn sm ghost" onclick="showTpl('${x[1]}',${sample})">Önizle</button></td></tr>`).join('')}</table></div>`;
}

/* ================= AI ASİSTAN ================= */
function ask(){
  const i=$('#cin'),q=i.value.trim();if(!q)return;const box=$('#msgs');
  box.insertAdjacentHTML('beforeend',`<div class="m u">${q.replace(/</g,'&lt;')}</div>`);i.value='';
  const l=q.toLowerCase();let a='Bu konuda size yardımcı olması için yetkilimize WhatsApp üzerinden bağlayabilirim. 💬';
  if(/fiyat|ücret|kaç/.test(l))a='Standart oda 650 ₺/gece, VIP süit 1.100 ₺/gece, oyun alanı 150 ₺/saat, tımar 300 ₺/saattir. 🐾';
  else if(/boş|müsait|doluluk|yer/.test(l))a='Boş yerleri “Müşteri Paneli → Rezervasyon Yap” takviminde gün ve saat bazında görebilirsiniz (yeşil = boş).';
  else if(/aşı|kuduz/.test(l))a='Girişte güncel karma ve kuduz aşısı kartı gerekir. Yavrular için ilk 2 aşı tamamlanmış olmalıdır.';
  else if(/saat|açık|çalış/.test(l))a='Hafta içi ve hafta sonu 08:00–20:00 arası kabul yapıyoruz. Pansiyon 7/24 bakım altındadır.';
  else if(/iptal|iade/.test(l))a='Girişten 48 saat öncesine kadar ücretsiz iptal; kapora iadesi 3–5 iş günü içinde yapılır.';
  else if(/eğitim|ders/.test(l))a='Yavru, temel itaat ve davranış eğitimi veriyoruz. İlk değerlendirme seansı ücretsizdir. 🎓';
  setTimeout(()=>{box.insertAdjacentHTML('beforeend',`<div class="m b">${a}</div>`);box.scrollTop=1e9},500);box.scrollTop=1e9;
}

/* ================= YÖNLENDİRME ================= */
const HASHM={site:'site',musteri:'cust',isletme:'biz'},REV={site:'site',cust:'musteri',biz:'isletme'};
function go(m){mode=m;try{history.replaceState(null,'','#'+REV[m])}catch(e){}render();window.scrollTo(0,0)}
window.addEventListener('hashchange',()=>{const m=HASHM[location.hash.slice(1)];if(m&&m!==mode){mode=m;render()}});
function render(){
  document.querySelectorAll('#modes button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  $('#app').innerHTML=emo(mode==='site'?viewSite():mode==='cust'?viewCust():viewBiz());icons();
  if(mode==='site')startSlider();
}
document.querySelectorAll('#modes button').forEach(b=>b.onclick=()=>go(b.dataset.m));
$('#brand').textContent=DEMO.name;['.top','.fab','.chat'].forEach(q=>iconize($(q)));
{const m=HASHM[location.hash.slice(1)];if(m)mode=m}
render();
</script>
